<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css">
  <title>Secure DB Manager</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">Secure DB Manager</div>
    <div class="userbox">
      <span id="currentUser"></span>
      <a href="#" id="logoutLink" class="logout-link">Выйти</a>
    </div>
  </header>

  <main class="layout">
    <section class="sidebar">
      <h3>Разделы</h3>
      <div id="tablesList"></div>
    </section>

    <section class="content">
      <div class="panel-header">
        <h3 id="activeTitle">—</h3>
      </div>
      <div id="toolbar" class="toolbar" style="display:none">
        <div id="toolbarFilters" class="toolbar-group"></div>
        <div class="toolbar-group">
          <button id="btnCreate" class="btn btn-primary" style="display:none">+ Создать</button>
        </div>
      </div>
      <div id="statusMsg" class="empty-state" style="display:none"></div>
      <div id="activeTable" class="grid-container"></div>
      <div id="pagination" class="pagination-bar" style="display:none">
        <button id="btnPrev" class="btn btn-xs">← Назад</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="btnNext" class="btn btn-xs">Вперёд →</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div id="modalError" class="modal-error"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" id="modalSave" onclick="doModalSave()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
