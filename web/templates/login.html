<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Secure DB Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f3f4f6; }
        .login-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; margin-top: 0; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .form-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        .btn-login { width: 100%; background-color: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 1rem; font-size: 1rem; }
        .btn-login:hover { background-color: #1d4ed8; }
        .btn-login:disabled { background-color: #93c5fd; cursor: not-allowed; }
        .error-msg { color: #dc2626; font-size: 0.875rem; margin-top: 0.75rem; text-align: center; min-height: 1.25rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Вход</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Пользователь</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••" autocomplete="current-password" required>
            </div>
            <div class="error-msg" id="errorMsg"></div>
            <button type="submit" class="btn-login" id="submitBtn">Войти</button>
        </form>
    </div>
    <script>
        var form = document.getElementById('loginForm');
        var errorMsg = document.getElementById('errorMsg');
        var submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Вход...';

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            try {
                var res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                var data = await res.json();

                if (!res.ok) {
                    errorMsg.textContent = data.message || 'Неверный логин или пароль';
                    return;
                }

                localStorage.setItem('jwt', data.token);
                window.location.href = '/';
            } catch (err) {
                errorMsg.textContent = 'Ошибка соединения с сервером';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
