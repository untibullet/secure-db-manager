<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | DB Explorer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f3f4f6; }
        .login-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        .btn-primary { width: 100%; background-color: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .hint { font-size: 0.875rem; color: #6b7280; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="text-align: center; margin-top: 0;">Вход</h2>
        <!-- Форма пока просто редиректит на главную через GET -->
        <form action="/" method="GET">
            <div class="form-group">
                <label for="username">Пользователь</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="ivan_ivanov" value="ivan_ivanov">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" value="secret">
            </div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>
        <div class="hint">
            (Мок-режим: любой пароль подойдет)
        </div>
    </div>
</body>
</html>
