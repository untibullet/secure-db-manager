      description: Доступно ролям test_lead, cicd_system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunStatusRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /runs/{id}/items:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    get:
      tags: [Test Runs]
      summary: Список тест-кейсов в прогоне
      description: Доступно ролям test_lead, automation_engineer, tester.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunItemView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Test Runs]
      summary: Добавить тест-кейс в прогон
      description: Доступно ролям test_lead, cicd_system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRunItemRequest'
      responses:
        "201":
          description: Добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunItemView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /runs/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: itemId
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [Test Runs]
      summary: Удалить тест-кейс из прогона
      description: Доступно роли test_lead.
      responses:
        "204":
          description: Удалён
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  # TEST RESULTS ────────────────────────────────────────────────────────────────

  /results:
    get:
      tags: [Test Results]
      summary: Список результатов тестирования
      description: |
        Роли test_lead и automation_engineer видят все результаты (v_lead_all_results).
        Роль tester видит только свои результаты (v_tester_my_results):
        поля run_name, executor и error_message не возвращаются.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: run_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Test Results]
      summary: Записать результат теста
      description: Доступно ролям tester, automation_engineer, cicd_system. Запись через v_results_manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResultRequest'
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /results/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    get:
      tags: [Test Results]
      summary: Получить результат по ID
      description: Роль test_lead — полная проекция. Тестировщик — только свой результат с ограниченными полями.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Test Results]
      summary: Обновить результат
      description: Доступно роли test_lead и tester (только свой результат).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResultRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Test Results]
      summary: Удалить результат
      description: Доступно роли test_lead.
      responses:
        "204":
          description: Удалён
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /results/{id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    get:
      tags: [Test Results]
      summary: Список артефактов результата
      description: Доступно ролям test_lead, automation_engineer, developer, tester, guest.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Test Results]
      summary: Добавить артефакт к результату
      description: Доступно ролям tester, automation_engineer, cicd_system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddArtifactRequest'
      responses:
        "201":
          description: Добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # AUTOTESTS ───────────────────────────────────────────────────────────────────

  /autotests:
    get:
      tags: [Autotests]
      summary: Список автотестов
      description: Доступно ролям automation_engineer, test_lead, developer (v_engineer_autotests).
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutotestView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Autotests]
      summary: Создать автотест
      description: Доступно роли automation_engineer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutotestRequest'
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutotestView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /autotests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    get:
      tags: [Autotests]
      summary: Получить автотест по ID
      description: Доступно ролям automation_engineer, test_lead, developer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutotestView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Autotests]
      summary: Обновить автотест
      description: >
        Полное обновление доступно роли automation_engineer.
        Роль test_lead имеет SELECT и UPDATE через v_autotests_manage,
        но на уровне сервиса может быть ограничена только полем is_active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutotestRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutotestView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Autotests]
      summary: Удалить автотест
      description: Доступно роли automation_engineer.
      responses:
        "204":
          description: Удалён
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /autotests/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    post:
      tags: [Autotests]
      summary: Добавить версию автотеста
      description: Доступно роли automation_engineer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutotestVersionView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # REFERENCE DATA ──────────────────────────────────────────────────────────────

  /environments:
    get:
      tags: [Reference Data]
      summary: Список конфигураций окружений
      description: Доступно всем ролям. Возвращает только активные окружения (v_shared_environments).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentView'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /reports:
    get:
      tags: [Reference Data]
      summary: Список отчётов о качестве
      description: Доступно всем ролям (v_shared_reports).
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # STATISTICS ──────────────────────────────────────────────────────────────────

  /stats/runs:
    get:
      tags: [Statistics]
      summary: Сводка выполнения по прогонам
      description: Доступно ролям test_lead, automation_engineer, developer (v_test_execution_summary).
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunSummaryView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /stats/cases:
    get:
      tags: [Statistics]
      summary: Статистика эффективности тест-кейсов
      description: Доступно ролям test_lead, automation_engineer, developer (v_test_case_statistics).
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseStatsView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # ADMIN ───────────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [Admin]
      summary: Список пользователей с ролями
      description: Доступно роли admin (v_admin_users_and_roles).
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserView'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Admin]
      summary: Создать пользователя
      description: >
        Доступно роли admin. Создаёт запись в users (UserRepo) и PostgreSQL login-роль
        (SystemRepo.CreateRole), затем выдаёт начальную групповую роль (SystemRepo.GrantGroupRole).
        Пароль атомарно сохраняется в bcrypt-хеш и pg_authid через SystemRepo.SetPasswordAndHash (AD-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    get:
      tags: [Admin]
      summary: Получить пользователя по ID
      description: Доступно роли admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/active:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    patch:
      tags: [Admin]
      summary: Активировать / деактивировать пользователя
      description: Доступно роли admin. Обновляет users.is_active через v_users_manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/lock:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    patch:
      tags: [Admin]
      summary: Установить / снять блокировку учётной записи
      description: Доступно роли admin. locked_until=null снимает блокировку немедленно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/IdPath'

    post:
      tags: [Admin]
      summary: Назначить роль пользователю
      description: >
        Доступно роли admin. Записывает назначение в v_user_roles_manage через
        UserRepo.AdminInsertUserRole, затем выполняет GRANT через SystemRepo.GrantGroupRole (AD-9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        "204":
          description: Роль назначена
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/roles/{roleId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: roleId
        in: path
        required: true
        schema:
          type: integer

    delete:
      tags: [Admin]
      summary: Отозвать роль у пользователя
      description: >
        Доступно роли admin. Удаляет запись из v_user_roles_manage,
        затем выполняет REVOKE через SystemRepo.RevokeGroupRole (AD-9).
      responses:
        "204":
          description: Роль отозвана
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /admin/audit-log:
    get:
      tags: [Admin]
      summary: Журнал аудита
      description: >
        Доступно роли admin. Чтение через v_admin_audit_log (AD-1).
        Прямой доступ к таблице audit_log закрыт для всех ролей через RLS.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: table_name
          in: query
          schema:
            type: string
            description: Имя таблицы для фильтрации (например, test_results)
        - name: operation
          in: query
          schema:
            type: string
            enum: [INSERT, UPDATE, DELETE]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
